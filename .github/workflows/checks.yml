name: Checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/ci-deploy.sh && bash -n tests/Deployment/deploy.sh
      - run: bash tests/Deployment/deploy.sh

  application:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: npm ci
      - run: node --test tests/Frontend/*.test.js
      - run: npm run build
      - name: Prepare storage directories
        run: mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions storage/logs bootstrap/cache
      - name: Run tests
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test_output.log

      - name: Report failures to commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 80 test_output.log > failed_summary.txt
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@failed_summary.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-log
          path: test_output.log

      - run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
