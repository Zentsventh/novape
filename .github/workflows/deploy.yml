name: Build and Deploy to Azure Container Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        run: |
          docker build -t ${{ secrets.REGISTRY_SERVER }}/novape-web:${{ github.sha }} -t ${{ secrets.REGISTRY_SERVER }}/novape-web:latest .
          docker push ${{ secrets.REGISTRY_SERVER }}/novape-web:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_SERVER }}/novape-web:latest
