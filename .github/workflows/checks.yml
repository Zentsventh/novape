name: Checks

on:
  push:
  pull_request:

jobs:
  deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/ci-deploy.sh && bash -n tests/Deployment/deploy.sh
      - run: bash tests/Deployment/deploy.sh

  application:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: npm ci
      - run: node --test tests/Frontend/*.test.js
      - run: npm run build
      - name: Run tests
        run: |
          php artisan test --compact > test_output.txt || (
            echo "### Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          )
      - run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
